name: release

# Builds and publishes release artifacts from a clean CI runner whenever a
# v*-tag is pushed. Nothing that ships to the scooter should be a binary
# someone's laptop happened to produce — this is the only path that's
# allowed to attach assets to a GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - run: go vet ./...

      - name: build ARM binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm GOARM=7 go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -s -w" \
            -o dist/music-service .

      - name: stage release files
        run: |
          cp install.sh music-completion.bash dist/
          ( cd dist && sha256sum music-service install.sh music-completion.bash > SHA256SUMS )

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/music-service dist/install.sh dist/music-completion.bash dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "Built by CI from ${GITHUB_SHA}." \
            --repo "${GITHUB_REPOSITORY}"
