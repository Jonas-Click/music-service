name: release

# Builds and publishes release artifacts from a clean CI runner whenever a
# v*-tag is pushed. Nothing that ships to the scooter should be a binary
# someone's laptop happened to produce — this is the only path that's
# allowed to attach assets to a GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - run: go vet ./...
      - run: python3 -m unittest discover -s tests -v

      - name: build ARM binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm GOARM=7 go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -s -w" \
            -o dist/music-service .

      - name: stage release files
        run: |
          sed -e "s|^RELEASE_REPOSITORY=.*|RELEASE_REPOSITORY=\"${GITHUB_REPOSITORY}\"|" \
              -e "s|^RELEASE_TAG=.*|RELEASE_TAG=\"${GITHUB_REF_NAME}\"|" install.sh > dist/install.sh
          cp music-completion.bash music-service.service config.json.example dist/
          ( cd dist && sha256sum music-service install.sh music-completion.bash \
              music-service.service config.json.example > SHA256SUMS )

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/music-service dist/install.sh dist/music-completion.bash \
            dist/music-service.service dist/config.json.example dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "Built by CI from ${GITHUB_SHA}." \
            --repo "${GITHUB_REPOSITORY}"
