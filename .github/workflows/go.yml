name: go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      - run: python3 -m unittest discover -s tests -v
      - name: build (host)
        run: go build ./...
      - name: build (arm target)
        run: GOOS=linux GOARCH=arm GOARM=7 go build -o music-service-arm .
